[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiss-neuro"
version = "0.1.0"
description = "Jumeau Numerique Cognitif souverain — pipeline connectome -> Hamiltonien fermionique -> topologie P_sig -> tryperposition -> certification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.8",
    "ripser>=0.6",
    "blake3>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
ibm = ["qiskit>=1.0", "qiskit-ibm-runtime>=0.23"]

[tool.setuptools.packages.find]
include = ["ratiss_neuro*"]
